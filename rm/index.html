/* FIN DE DATOS EDITABLES */
const $ = id => document.getElementById(id);
$('name').textContent = contacto.nombre;
$('role').textContent = [contacto.cargo, contacto.empresa].filter(Boolean).join(' · ');
$('bio').textContent = contacto.descripcion;
$('bio').hidden = !contacto.descripcion;
if(contacto.foto){const img=document.createElement('img');img.src=contacto.foto;img.alt='Foto de '+contacto.nombre;$('avatar').appendChild(img)}
else{$('avatar').textContent=contacto.nombre.trim().split(/\s+/).slice(0,2).map(s=>s[0]||'').join('').toUpperCase();$('avatar').setAttribute('aria-hidden','true')}
$('logo').src=contacto.logo;
$('logo').hidden=!contacto.logo;
$('email').hidden=!contacto.email;
if(contacto.email)$('email').href='mailto:'+contacto.email;
const validHttp = value => {try {const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}};
const telefono=contacto.telefono.replace(/[^+\d]/g,'');
const links=[['Llamar',telefono?'tel:'+telefono:null],['LinkedIn',validHttp(contacto.linkedin)],['Sitio web',validHttp(contacto.web)]];
for(const [label,href] of links){if(!href)continue;const a=document.createElement('a');a.textContent=label;a.href=href;if(href.startsWith('http')){a.target='_blank';a.rel='noopener noreferrer'}$('links').appendChild(a)}
const esc=v=>String(v||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,');
const vcard=[
 'BEGIN:VCARD','VERSION:3.0',
 'FN:'+esc(contacto.nombre),
 'ORG:'+esc(contacto.empresa),
 'TITLE:'+esc(contacto.cargo),
 ...(telefono?['TEL;TYPE=CELL:'+esc(contacto.telefono)]:[]),
 ...(contacto.email?['EMAIL;TYPE=INTERNET:'+esc(contacto.email)]:[]),
 ...(validHttp(contacto.web)?['URL:'+esc(contacto.web)]:[]),
 ...(validHttp(contacto.linkedin)?['URL:'+esc(contacto.linkedin)]:[]),
 'END:VCARD'
].join('\r\n')+'\r\n';
const blob=new Blob([vcard],{type:'text/vcard;charset=utf-8'});
const objectUrl=URL.createObjectURL(blob);
$('save').href=objectUrl;
$('save').download='contacto.vcf';
</script>
